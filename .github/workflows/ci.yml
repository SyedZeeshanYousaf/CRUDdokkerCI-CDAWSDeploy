name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify server starts without crashing
        run: |
          timeout 10s node server.js &
          SERVER_PID=$!
          sleep 3
          kill $SERVER_PID 2>/dev/null || true
        env:
          DB_HOST: localhost
          DB_USER: root
          DB_PASSWORD: ""
          DB_NAME: products
          DB_PORT: 3306
          PORT: 3000

      - name: Build Docker image
        run: docker build -t product-crud-api:${{ github.sha }} .

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd app
            git pull origin main
            docker build -t product-crud-api .
            docker stop product-crud-api || true
            docker rm product-crud-api || true
            docker run -d --name product-crud-api -p 3000:3000 --env-file .env product-crud-api