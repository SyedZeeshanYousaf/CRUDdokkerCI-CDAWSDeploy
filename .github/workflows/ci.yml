name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Optional: Spin up a MySQL test service so server startup does not fail on DB connection
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: products
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify server starts without crashing
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 4
          kill -0 $SERVER_PID
          kill $SERVER_PID
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ""
          DB_NAME: products
          DB_PORT: 3308
          PORT: 5000

      - name: Test Docker build
        run: docker build -t product-crud-api:${{ github.sha }} .

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd app
            git pull origin main
            docker build -t product-crud-api .
            docker stop product-crud-api || true
            docker rm product-crud-api || true
            docker run -d \
              --name product-crud-api \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file .env \
              product-crud-api
            docker image prune -f